plugins {
    id 'com.cleanroommc.versioning' version '2.0.0'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'signing'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

group = 'com.cleanroommc'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'

    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs.add('--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED')
}

tasks.named('pluginUnderTestMetadata') {
    pluginClasspath.setFrom(tasks.named('jar'), configurations.runtimeClasspath)
}

gradlePlugin {
    website = 'https://github.com/CleanroomMC/GradleTokenEnvoy'
    vcsUrl = 'https://github.com/CleanroomMC/GradleTokenEnvoy.git'
    plugins {
        tokenEnvoy {
            id = "${group}.tokenenvoy"
            implementationClass = "${group}.tokenenvoy.TokenEnvoyPlugin"
            displayName = 'Token Envoy'
            description = 'Replaces tokens during Java compilation and resource processing without rewriting sources.'
            tags.set(['token', 'replacement', 'asm', 'resources'])
            compatibility {
                features {
                    configurationCache = true
                }
            }
        }
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Implementation-Version': version
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('-add-exports', 'jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED')
}

publishing {
    publications {
        pluginMaven(MavenPublication) {
            artifactId = 'tokenenvoy'
        }
    }
    repositories {
        maven {
            name = 'CleanroomMaven'
            url = 'https://maven.cleanroommc.com'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

def signingKey = providers.gradleProperty('signingKey')
def signingPassword = providers.gradleProperty('signingPassword')

signing {
    required = {
        gradle.taskGraph.allTasks.any { it.name == 'publishPlugins' }
    }
    if (signingKey.present && signingPassword.present) {
        useInMemoryPgpKeys(signingKey.get(), signingPassword.get())
    }
}
